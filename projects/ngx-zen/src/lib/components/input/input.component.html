@if(control){
<div
  class="__zen__form__control"
  [ngClass]="[zenClass, size, shape, icon ? iconPosition : '']"
>
  @if(label){
  <label [for]="id" class="__zen__form__control__label" [ngStyle]="getStyle()">{{ label }}</label>
  }
  <fieldset>
    <legend class="sr-only">{{ label }}</legend>
    @if(icon && iconPosition) {
    <i class="fa-solid" [ngClass]="[icon, iconPosition]" [ngStyle]="getStyle()"></i>
    }
    <input
      [type]="type"
      [placeholder]="placeholder"
      [id]="id"
      class="__zen__form__control__input"
      [autocomplete]="autoComplete"
      [formControl]="control"
      [ngStyle]="getInputStyle()"
    />
  </fieldset>
  @if(control.invalid && control.touched) {
  <validation-error
    [errors]="control.errors"
    [zenClass]="zenClass"
    [customErrorMessages]="customErrorMessages"
    [color]="getErrorColor()"
  ></validation-error>
  }
</div>
}
