<div class="__ngx__zen__tooltip__wrapper" [ngClass]="[zenClass]">
  @if (template) {
  <div class="element" (mouseenter)="toggle()" (mouseleave)="toggle()">
    <ng-container [ngTemplateOutlet]="template"></ng-container>
  </div>
  } @else {
  <div
    class="icon"
    [ngStyle]="getIconStyle()"
    (mouseenter)="toggle()"
    (mouseleave)="toggle()"
  >
    <i class="fa-regular" [ngClass]="[icon ? icon : 'fa-question']"></i>
  </div>
  } @if (isActive) {
  <div
    class="content"
    [ngClass]="[shape, size, positionX, positionY]"
    [ngStyle]="getContentStyle()"
  >
    @if(text) {
    <p>{{ text }}</p>
    }

    <ng-content></ng-content>

    <span class="pointer" [ngStyle]="getPointerStyle()"></span>
  </div>
  }
</div>
