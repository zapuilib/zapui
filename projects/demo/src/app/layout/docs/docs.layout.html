<app-header class="sticky top-0 z-30"></app-header>
<main class="px-6 grid grid-cols-24 min-h-[calc(100dvh-45px)] lg:gap-x-6">
  <aside
    class="hidden lg:col-span-6 h-[calc(100vh-45px)] lg:block sticky top-[45px] pt-6 border-r border-zinc-800 light:border-zinc-100 overflow-auto xl:col-span-5 scrollable">
    <app-sidenav [navigations]="navigations"></app-sidenav>
  </aside>
  <article
    class="col-span-24 lg:col-span-12 lg:col-start-7 py-3 min-h-[calc(100dvh-50px)] flex flex-col">
    <banner>
      <div class="flex gap-x-3">
        <div>
          <h2 class="leading-6 mb-1 !text-zinc-200 light:!text-zinc-800 typ">
            We are currently in alpha version.
          </h2>
          <p
            class="!leading-6 !text-zinc-400 text-xs 2xl:text-sm font-mono tracking-tighter !pt-1 !inline-block typewriter">
            <span class="text">
              <i class="fa-solid fa-terminal text-zinc-200 light:!text-zinc-800 mr-2"></i>
              Please expect changes. If you find any issues, please report them on our
              <a
                href="https://github.com/zapuilib/zapui/issues"
                target="_blank"
                class="font-mono !text-zinc-200 light:!text-zinc-800"
                >github</a
              >.
            </span>
          </p>
        </div>
      </div>
    </banner>
    <router-outlet></router-outlet>
    <app-footer class="mt-auto"></app-footer>
  </article>
</main>
