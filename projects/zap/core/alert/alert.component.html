<div
  class="__ngx__zap__alert"
  [ngClass]="classes"
>
  <div class="content__wrapper">
    @if(type !== 'default') {
      <div class="type__wrapper">
        <i class="fa-solid" [ngClass]="[icon]"></i>
      </div>
    }
    <ng-content></ng-content>
  </div>
  <div class="handler" (click)="dismiss.emit()">
    <i class="fa-solid fa-xmark"></i>
  </div>
</div>
