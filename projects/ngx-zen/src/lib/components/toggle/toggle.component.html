<div
  class="__ngx__toggle__wrapper"
  [ngClass]="[zenClass]"
  [ngStyle]="{ width: label || text ? '100%' : 'fit-content' }"
>
  <div class="content-wrapper">
    <div class="lable-wrapper">
      @if(label) {
      <label [ngStyle]="getLabelStyle()">
        {{ label }}
      </label>
      } @if(text) {
      <p [ngStyle]="getTextStyle()">{{ text }}</p>
      }
    </div>
  </div>

  <button [ngStyle]="getToggleStyle()" (click)="handleToggle()">
    <span
      class="roller"
      [ngClass]="[isToggleOn ? 'on' : 'off']"
      [ngStyle]="getRollerStyle()"
    ></span>
  </button>
</div>
