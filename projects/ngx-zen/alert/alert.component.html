<div
  class="__ngx__zen__alert"
  [ngClass]="[classes]"
>
  <div class="content__wrapper">
    <div *ngIf="type !== 'default'" class="type__wrapper">
      <i class="fa-solid" [ngClass]="[icon]"></i>
    </div>
    <ng-content></ng-content>
  </div>
  <div class="handler__wrapper" (click)="dismiss.emit()">
    <i class="fa-solid fa-xmark"></i>
  </div>
</div>
