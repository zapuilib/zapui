<div
  class="__ngx__zen__dialog__wrapper"
  [ngClass]="[position, shape, zenClass]"
  [ngStyle]="getWrapperStyle()"
>
  <div class="inner" [ngStyle]="getInnerStyle()">
    <div class="content">
      <div class="header" [ngStyle]="getHeaderStyle()">
        <h3 [ngStyle]="getTitleStyle()">{{ title }}</h3>

        <div class="handler" (click)="cancel.emit()">
          <i class="fa-solid fa-xmark" [ngStyle]="getIconStyle()"></i>
        </div>
      </div>

      @if(text) {
      <div class="helper">
        <p class="text" [ngStyle]="getTextStyle()">{{ text }}</p>
      </div>
      }

      <ng-content></ng-content>
    </div>

    <div class="footer">
      @if (secondaryBtnTemplate) {
      <ng-container [ngTemplateOutlet]="secondaryBtnTemplate"></ng-container>
      } @else {
      <ngx-zen-button
        text="Cancel"
        [shape]="shape"
        variant="outlined"
      ></ngx-zen-button>
      } @if (primaryBtnTemplate) {
      <ng-container [ngTemplateOutlet]="primaryBtnTemplate"></ng-container>
      } @else {
      <ngx-zen-button text="Confirm" [shape]="shape"></ngx-zen-button>
      }
    </div>
  </div>
</div>
