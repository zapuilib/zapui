<div class="table-wrapper" 
     [ngClass]="[
       zenClass,
       size,
       shape,
       { 
         'hoverable': hoverable, 
         'striped': striped, 
         'borderless': borderless, 
         'selectable': selectable, 
         'sortable': sortable, 
         'searchable': searchable 
       }
     ]" 
     [ngStyle]="getTableWrapperStyle()">
  <table class="table" [ngStyle]="getTableStyle()">
    <thead>
      <ng-content select="ngx-zen-table-head"></ng-content>
    </thead>
    <tbody>
      <ng-content select="ngx-zen-table-body"></ng-content>
    </tbody>
  </table>
</div>
