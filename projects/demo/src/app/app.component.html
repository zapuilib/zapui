<div
  class="wrapper mx-auto max-w-screen-2xl grid grid-cols-3 py-10 min-h-screen gap-5"
>
  <ngx-zen-button
    text="Explore now"
    zenClass="bg-lime-300 border-lime-300"
  ></ngx-zen-button>
  <ngx-zen-button text="Switch theme" shape="flat" size="base" (click)="toggleTheme()"></ngx-zen-button>
  <ngx-zen-badge [count]="100"></ngx-zen-badge>
  <ngx-zen-chip shape="pill" text="Pending" zenClass="chip-text:text-lime-700"></ngx-zen-chip>
  <div class="relative w-full h-full col-span-2">
    <ngx-zen-dialog zenClass="!absolute"></ngx-zen-dialog>
  </div>
  <ngx-zen-input
    label="Username"
    formControl="usernameControl"
    placeholder="Enter your username"
  ></ngx-zen-input>
  <div class="relative w-full h-full">
    <ngx-zen-modal zenClass="!absolute">
      <h2 class="font-semibold">Modal</h2>
      <p class="mt-2">
        Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod
        tempor incididunt ut labore et dolore magna aliqua
      </p>
    </ngx-zen-modal>
  </div>
</div>
