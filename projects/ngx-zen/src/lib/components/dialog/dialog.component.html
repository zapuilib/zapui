<div class="__ngx__zen__dialog__wrapper" [ngClass]="[shape, zenClass]">
  <div class="wrapper" [ngStyle]="getWrapperStyle()">
    <div class="header">
      <h3 [ngStyle]="getTitleStyle()">{{ title }}</h3>
    </div>

    <div class="content">
      @if(text) {
      <p class="text" [ngStyle]="getTextStyle()">{{ text }}</p>
      }

      <ng-content></ng-content>
    </div>

    <div class="footer">
      @if (secondaryBtnTemplate) {
      <ng-container [ngTemplateOutlet]="secondaryBtnTemplate"></ng-container>
      } @else {
      <ngx-zen-button
        text="Cancel"
        [shape]="shape"
        variant="outlined"
      ></ngx-zen-button>
      } @if (primaryBtnTemplate) {
      <ng-container [ngTemplateOutlet]="primaryBtnTemplate"></ng-container>
      } @else {
      <ngx-zen-button text="Confirm" [shape]="shape"></ngx-zen-button>
      }
    </div>
  </div>
</div>
