<div class="accordion">
  <div class="accordion__header" (click)="toggleAccordion()">
    <ng-content select="[accordion-header]"></ng-content>
    <span class="accordion__icon">{{ isOpen ? '-' : '+' }}</span>
  </div>
  <div class="accordion__content" *ngIf="isOpen">
    <div class="content__wrapper">
      <ng-content select="[accordion-content]"></ng-content>
    </div>
  </div>
</div>
