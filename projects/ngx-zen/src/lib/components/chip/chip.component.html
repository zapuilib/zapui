<div
  class="__ngx__zen__chip__wrapper"
  [ngClass]="[variant, size, disabled ? 'disabled' : '', zenClass]"
  [ngStyle]="getStyle()"
>
  @if (icon) {
  <i class="fa-solid" [ngClass]="[icon, iconPosition]"></i>
  }
  <span class="chip__text" [ngStyle]="getTextStyle()">{{ text }}</span>

  @if (dismissible) {
  <button class="chip__remove" (click)="onRemove($event)" [disabled]="disabled">
    <i class="fa-solid fa-times"></i>
  </button>
  }
</div>
