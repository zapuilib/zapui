<div class="__ngx__textarea__wrapper" [class]="[zenClass, shape]">
  @if(label){
  <label
    [for]="id"
    class="__zen__form__control__label"
    [ngStyle]="getStyle()"
    >{{ label }}</label
  >
  }
  <fieldset>
    
    <textarea
      [id]="id"
      [formControl]="control"
      [rows]="rows"
      [placeholder]="placeholder"
      [ngStyle]="getFieldStyle()"
      [ngClass]="resize === 'vertical' ? 'resize' : ''"
      (input)="adjustRows($event)"
    ></textarea>
  </fieldset>
  @if(control.invalid && control.touched) {
  <validation-error
    [errors]="control.errors"
    [zenClass]="zenClass"
    [customErrorMessages]="customErrorMessages"
    [color]="getErrorColor()"
  ></validation-error>
  }
</div>
