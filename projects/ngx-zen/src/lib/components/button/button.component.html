<button
  [ngClass]="[type, size, shape, variant, zenClass]"
  [disabled]="disabled"
  [ngStyle]="getStyle()"
>
  @if(icon && iconPosition) {
  <i class="fa-solid" [ngClass]="[icon, iconPosition]"></i>
  } @else if (img && imgPosition) {
  <img [src]="img" alt="Logo" [ngClass]="[imgPosition]"/>
  } @if(type !== 'icononly') {
  {{ text }}
  }
</button>
