<div class="__ngx__radio__wrapper" [ngClass]="[variant, zenClass]">
  <div class="wrapper">
    @for (radio of options; track radio) {
    <fieldset (change)="control.setValue(radio.value)">
      <input
        type="radio"
        [id]="radio.value"
        [value]="radio.value"
        [formControl]="control"
        [ngStyle]="getRadioStyle()"
      />

      @if(radio.name){
      <legend class="sr-only">{{ radio.value }}</legend>
      <label
        class="__zen__form__control__label"
        [for]="radio.value"
        [ngStyle]="getLabelStyle()"
        >{{ radio.name }}</label
      >
      }
    </fieldset>
    }
  </div>

  @if(control.invalid && control.touched) {
  <validation-error
    [errors]="control.errors"
    [zenClass]="zenClass"
    [customErrorMessages]="customErrorMessages"
    [color]="getErrorColor()"
  ></validation-error>
  }
</div>
