<!-- accordion.component.html -->
<div
  class="__zen__accordion__wrapper"
  [ngClass]="[zenClass, shape, size, transition, 'icon-' + iconPosition]"
>
  <div
    class="__zen__accordion__header"
    (click)="toggleAccordion()"
    [ngStyle]="getHeaderStyle()"
  >
    <span class="accordion__title">{{ title }}</span>
    <i
      class="accordion__icon"
      [ngClass]="isOpen ? 'fa fa-minus' : 'fa fa-plus'"
      [ngStyle]="getIconStyle()"
      aria-hidden="true"
    ></i>
  </div>
  <div
    class="__zen__accordion__content"
    *ngIf="isOpen"
    [ngStyle]="getContentStyle()"
  >
    <ng-content></ng-content>
  </div>
</div>
