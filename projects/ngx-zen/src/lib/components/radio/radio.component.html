<div class="__ngx__radio__wrapper" [ngClass]="[variant, zenClass]">
  <div class="wrapper">
    @if(label) {
    <p [ngStyle]="getLabelStyle()">{{ label }}</p>
    }
    <div class="options__wrapper">
      @for (radio of options; track radio) {
      <fieldset>
        <input
          type="radio"
          [id]="radio.value"
          [formControl]="control"
          [value]="radio.value"
          [ngStyle]="getRadioStyle()"
        />

        <label
          class="__zen__form__control__label"
          [for]="radio.value"
          [ngStyle]="getLabelStyle()"
          (click)="control.setValue(radio.value)"
          >{{ radio.name }}</label
        >
      </fieldset>
      }
    </div>
  </div>

  @if(control.invalid && control.touched) {
  <validation-error
    [errors]="control.errors"
    [zenClass]="zenClass"
    [customErrorMessages]="customErrorMessages"
    [color]="getErrorColor()"
  ></validation-error>
  }
</div>
