<div 
    class="__ngx__zen__chip__wrapper" 
    [ngStyle]="getStyle()"
  >
  @if (avatar) {
    <img [src]="avatar" alt="Avatar" class="ngx-zen-chip-avatar">
  }

  @if (icon && iconPosition === 'left') {
    <i class="fa-solid" [ngClass]="icon"></i>
  }
  <span class="ngx-zen-chip-text">{{ text }}</span>
  @if (icon && iconPosition === 'right') {
    <i class="fa-solid" [ngClass]="icon"></i>
  }
  @if (status) {
    <span class="ngx-zen-chip-status"></span>
  }
  @if (removable) {
    <button class="ngx-zen-chip-remove" (click)="onRemove($event)" [disabled]="disabled">
      <i class="fa-solid fa-times"></i>
    </button>
  }
</div>
