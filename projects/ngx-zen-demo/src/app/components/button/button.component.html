<section class="h-screen" [ngClass]="[theme]">
  @if(theme === 'light') {
  <div class="light grid grid-cols-12 gap-10">
    <ngx-zen-button text="Submit"></ngx-zen-button>

    <ngx-zen-button text="Submit" theme="light" shape="curve"></ngx-zen-button>

    <ngx-zen-button text="Submit" theme="light" shape="pill"></ngx-zen-button>

    <ngx-zen-button text="Submit" theme="light" size="compact"></ngx-zen-button>
    <ngx-zen-button text="Submit" theme="light" size="wide"></ngx-zen-button>

    <ngx-zen-button
      text="Submit"
      theme="light"
      variant="outlined"
    ></ngx-zen-button>

    <ngx-zen-button text="Submit" theme="light" icon="fa-upload" shape="curve"></ngx-zen-button>

    <ngx-zen-button text="Submit" theme="light" variant="text"></ngx-zen-button>
    <ngx-zen-button text="Submit" theme="light" variant="link"></ngx-zen-button>

    <ngx-zen-button text="Submit" theme="light" type="icononly" icon="fa-search" shape="pill"></ngx-zen-button>

    <ngx-zen-button
      text="Submit"
      theme="light"
      type="default"
      variant="default"
      size="default"
      shape="default"
      [disabled]="true"
    ></ngx-zen-button>

  </div>
  } @else {
  <div class="dark">
    <ngx-zen-button
      text="Submit"
      theme="dark"
      type="default"
      variant="default"
      size="default"
      shape="default"
      [disabled]="false"
    ></ngx-zen-button>
  </div>
  }
</section>
