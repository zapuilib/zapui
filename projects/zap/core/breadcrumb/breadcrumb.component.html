<div [ngClass]="classes" [style.gap]="size() !== 'tight' ? gap() + 'rem' : '0.25rem'">
  @for (item of items(); track $index; let last = $last) {
    @if (item.url) {
      <a [routerLink]="item.url" [routerLinkActive]="['active']">
        {{ item.label }}
      </a>
    } @else {
      <span>{{ item.label }}</span>
    }
    @if (!last) {
      @switch (separator()) {
        @case ('arrow') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path opacity=".4" d="" />
            <path
              d="M569 337C578.4 327.6 578.4 312.4 569 303.1L401 135C391.6 125.6 376.4 125.6 367.1 135C357.8 144.4 357.7 159.6 367.1 168.9L494.1 295.9L88 295.9C74.7 295.9 64 306.6 64 319.9C64 333.2 74.7 343.9 88 343.9L494.1 343.9L367.1 470.9C357.7 480.3 357.7 495.5 367.1 504.8C376.5 514.1 391.7 514.2 401 504.8L569 337z" />
          </svg>
        }
        @case ('chevron') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path
              d="M473.5 303C482.9 312.4 482.9 327.6 473.5 336.9L273.5 536.9C264.1 546.3 248.9 546.3 239.6 536.9C230.3 527.5 230.2 512.3 239.6 503L422.6 320L239.6 137C230.2 127.6 230.2 112.4 239.6 103.1C249 93.8 264.2 93.7 273.5 103.1L473.5 303.1z" />
          </svg>
        }
        @case ('slash') {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path
              d="M468.1 67.3C479.5 74 483.4 88.7 476.7 100.1L204.7 564.1C198 575.5 183.3 579.4 171.9 572.7C160.5 566 156.6 551.3 163.3 539.9L435.3 75.9C442 64.4 456.7 60.6 468.1 67.3z" />
          </svg>
        }
        @default {
          <svg zapIcon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"></svg>
        }
      }
    }
  }
</div>
