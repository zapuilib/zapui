<div class="flex flex-col space-y-8 w-full">
  <div>
    <h3 class="mb-4 text-lg font-semibold">Default Toggle (Unchecked)</h3>
    <zap-toggle
      id="toggle-default"
      label="Save preferences"
      helpText="Enable this setting to save your preferences"
      [formControl]="toggleControl"
      class="w-full"></zap-toggle>
  </div>

  <div>
    <h3 class="mb-4 text-lg font-semibold">Toggle with Default Checked State</h3>
    <zap-toggle
      id="toggle-checked"
      label="Enable notifications"
      helpText="This toggle starts checked by default"
      [formControl]="toggleCheckedControl"
      [checked]="true"
      class="w-full"></zap-toggle>
  </div>

  <div>
    <h3 class="mb-4 text-lg font-semibold">Toggle with Unchecked Default</h3>
    <zap-toggle
      id="toggle-unchecked"
      label="Auto-save"
      helpText="This toggle starts unchecked by default"
      [formControl]="toggleUncheckedControl"
      [checked]="false"
      class="w-full"></zap-toggle>
  </div>
</div>
