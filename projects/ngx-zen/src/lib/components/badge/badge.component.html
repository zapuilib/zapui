<div class="__ngx__zen__badge__wrapper" [ngClass]="[variant, zenClass]">
  @if (variant !== 'empty') {
    <span class="notification__badge" [ngStyle]="getStyle()">
      {{ getNotificationContent() }}
    </span>
  } @else {
    <span class="notification__badge empty" [ngStyle]="getStyle()"></span>
  }
</div>
