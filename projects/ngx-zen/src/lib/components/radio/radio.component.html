<div class="__ngx__radio__wrapper" [ngClass]="[shape, zenClass]">
  @for (radio of options; track radio) {
  <fieldset>
    @if(radio.label){
    <legend class="sr-only">{{ radio.label }}</legend>
    <label
      class="__zen__form__control__label"
      [for]="radio.id"
      [ngStyle]="getStyle()"
      >{{ radio.label }}</label
    >
    }

    <input type="radio" [id]="radio.id" [formControl]="control" />
  </fieldset>
  } @if(control.invalid && control.touched) {
  <validation-error
    [errors]="control.errors"
    [zenClass]="zenClass"
    [customErrorMessages]="customErrorMessages"
    [color]="getErrorColor()"
  ></validation-error>
  }
</div>
