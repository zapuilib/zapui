<div class="__ngx__zen__tooltip__wrapper" [ngClass]="[zenClass]">
  <div class="icon" (mouseenter)="toggle()" (mouseleave)="toggle()">
    <i [ngClass]="[icon ? icon : 'fa-regular fa-question']"></i>
  </div>

  @if (isActive) {
  <div class="content" [ngClass]="[positionX, positionY]">
    @if(text) {
    <p>{{ text }}</p>
    }

    <ng-content></ng-content>

    <span class="pointer"></span>
  </div>
  }
</div>
