<div class="__ngx__modal__wrapper" [ngClass]="[shape, size, style, zenClass]" [ngStyle]="getStyle()">
    <div class="__ngx__modal__inner wrapper" >
        <div class="__ngx__modal modal" [ngStyle]="getModalStyle()">
            <div class="handler" (click)="close.emit()">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <div class="content">
                <ng-content></ng-content>
            </div>
        </div>
    </div>
</div>
