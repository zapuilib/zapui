<div
  class="wrapper mx-auto max-w-screen-2xl grid grid-cols-3 py-10 min-h-screen gap-5"
>
  <div>
    <zap-button text="Merge" icon="fa-code-merge"></zap-button>
  </div>
  <div>
    <zap-button
      text="Switch theme"
      shape="flat"
      size="base"
      (click)="toggleTheme()"
    ></zap-button>
  </div>
  <zap-badge [count]="100"></zap-badge>
  <zap-chip text="Awaiting confirmation" icon="fa-bell" type="info"></zap-chip>
  <div class="relative w-full h-full col-span-2 dark:bg-[#09090B]/90 z-[10]">
    <zap-dialog zapClass="!absolute"></zap-dialog>
  </div>
  <div class="relative w-full h-full col-span-2 px-10 dark:bg-[#09090B]/90">
    <zap-modal zapClass="!absolute" size="tight">
      <h2 class="font-semibold">Modal</h2>
      <p class="mt-2">
        Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod
        tempor incididunt ut labore et dolore magna aliqua
      </p>
      <div class="flex justify-end mt-10">
        <zap-button text="Save changes"></zap-button>
      </div>
    </zap-modal>
  </div>
  <div class="relative w-full h-full col-span-1 dark:bg-[#09090B]/90 z-[10]">
    <zap-alert type="info"> You have a new alert </zap-alert>
  </div>
  <zap-input
    label="Username"
    formControl="usernameControl"
    placeholder="Enter your username"
  ></zap-input>
</div>
