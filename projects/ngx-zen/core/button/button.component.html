<button
  [ngClass]="classes"
  [disabled]="disabled"
>
  <ng-container *ngIf="icon && iconPosition">
    <i class="fa-solid" [ngClass]="[icon, iconPosition]"></i>
  </ng-container>
  <ng-container *ngIf="img && imgPosition">
    <img [src]="img" alt="Logo" [ngClass]="[imgPosition]" />
  </ng-container>
  <ng-container *ngIf="type !== 'icononly'">
    {{ text }}
  </ng-container>
</button>
