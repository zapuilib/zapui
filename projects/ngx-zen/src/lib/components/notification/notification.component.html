<div class="notification-wrapper" [ngClass]="[variant, zenClass]">
  @if (variant !== 'empty') {
    <span class="notification-badge" [ngStyle]="getStyle()">
      {{ getNotificationContent() }}
    </span>
  } @else {
    <span class="notification-badge empty" [ngStyle]="getStyle()"></span>
  }
</div>
