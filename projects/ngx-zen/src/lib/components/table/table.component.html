<div class="__zen__table__wrapper" 
     [ngClass]="[
       zenClass,
       disabled ? 'disabled' : '',
       hoverable ? 'hoverable' : '',
       striped ? 'striped' : ''
     ]">
  @if (title) {
    <div class="__zen__table__title" [ngStyle]="getTableStyle()">
      {{ title }}
    </div>
  }
  <div class="__zen__table__content">
    <table class="__zen__table">
      <ng-content></ng-content>
    </table>
  </div>
</div>
