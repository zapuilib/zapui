<div class="__ngx__checkbox__wrapper" [ngClass]="[shape, labelPosition, zenClass]" >
  <fieldset>
    @if(label){
    <legend class="sr-only">{{ label }}</legend>
    <label
      #labelElement
      [for]="id"
      class="__zen__form__control__label"
      [ngStyle]="getStyle()"
      >{{ label }}</label
    >
    }
    <input [id]="id" type="checkbox" [formControl]="control" [ngStyle]="getCheckboxStyle()" />
  </fieldset>
  @if(control.invalid && control.touched) {
  <validation-error
    [errors]="control.errors"
    [zenClass]="zenClass"
    [customErrorMessages]="customErrorMessages"
    [color]="getErrorColor()"
  ></validation-error>
  }
</div>
