<table [ngClass]="tableClasses()">
  <thead>
    <tr>
      @for (column of columns; track column.key) {
        <th>{{ column.header }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (row of data; track $index) {
      <tr (click)="onRowClick(row)">
        @for (column of columns; track column.key) {
          <td>{{ row[column.key] }}</td>
        }
      </tr>
    }
  </tbody>
</table>
