<div class="__zen__table__wrapper" 
     [ngClass]="[
       zenClass,
       size,
       shape,
       transition,
       disabled ? 'disabled' : '',
       sortable ? 'sortable' : '',
       selectable ? 'selectable' : ''
     ]">
  @if (title) {
    <div class="__zen__table__title" [ngStyle]="getTableStyle()">
      {{ title }}
    </div>
  }
  @if (subtitle) {
    <div class="__zen__table__subtitle" [ngStyle]="getSubtitleStyle()">
      {{ subtitle }}
    </div>
  }
  <div class="__zen__table__content">
    <table class="__zen__table">
      <ng-content></ng-content>
    </table>
  </div>
</div>
