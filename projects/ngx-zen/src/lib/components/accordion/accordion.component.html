<div
  class="__zen__accordion__wrapper"
  [ngClass]="[zenClass, size, shape, transition, 'icon-' + iconPosition]"
>
  <div class="__zen__accordion__header" (click)="toggleAccordion()">
    <span class="accordion__title" [ngClass]="zenClass">{{ title }}</span>
    <i
      class="accordion__icon fa"
      [ngClass]="[icon]"
      [attr.style]="getIconStyle()"
      aria-hidden="true"
    ></i>
  </div>
  @if (isOpen) {
    <ng-content></ng-content>
  }
</div>
