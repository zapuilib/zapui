<section class="min-h-screen">
  <app-code-block
    title="Basic button"
    description="Import a basic button in your component, additional params and their usage is explained below"
    [markdownData]="markdown[0]"
  >
    <ngx-zen-button text="Submit" zenClass="bg-red-500"></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Curve button"
    description=""
    [markdownData]="markdown[1]"
  >
    <ngx-zen-button text="Submit" theme="light" shape="curve"></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Pill button"
    description=""
    [markdownData]="markdown[2]"
  >
    <ngx-zen-button text="Submit" theme="light" shape="pill"></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Compact button"
    description=""
    [markdownData]="markdown[3]"
  >
    <ngx-zen-button text="Submit" theme="light" size="compact"></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Tight button"
    description=""
    [markdownData]="markdown[4]"
  >
    <ngx-zen-button text="Submit" theme="light" size="tight"></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Wide button"
    description=""
    [markdownData]="markdown[5]"
  >
    <ngx-zen-button text="Submit" theme="light" size="wide"></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Outlined button"
    description=""
    [markdownData]="markdown[6]"
  >
    <ngx-zen-button
      text="Submit"
      theme="light"
      variant="outlined"
    ></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Icon button"
    description=""
    [markdownData]="markdown[7]"
  >
    <ngx-zen-button
      text="Submit"
      theme="light"
      icon="fa-arrow-up"
      shape="curve"
    ></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Link button"
    description=""
    [markdownData]="markdown[8]"
  >
    <ngx-zen-button text="Submit" theme="light" variant="link"></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Icononly button"
    description=""
    [markdownData]="markdown[9]"
  >
    <ngx-zen-button
      text="Submit"
      theme="light"
      type="icononly"
      icon="fa-search"
      shape="pill"
    ></ngx-zen-button>
  </app-code-block>

  <app-code-block
    title="Disabled button"
    description=""
    [markdownData]="markdown[10]"
  >
    <ngx-zen-button
      text="Submit"
      theme="light"
      [disabled]="true"
    ></ngx-zen-button>
  </app-code-block>
</section>
