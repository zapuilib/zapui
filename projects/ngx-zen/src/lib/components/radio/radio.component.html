<div class="__ngx__radio__wrapper" [ngClass]="[shape, zenClass]">
  <fieldset>
    @if(label){
    <legend class="sr-only">{{ label }}</legend>
    <label
      #labelElement
      class="__zen__form__control__label"
      [for]="id"
      [ngStyle]="getStyle()"
      (click)="radio.click()"
      >{{ label }}</label
    >
    }

    <input
      #radio
      type="radio"
      [id]="id"
      [name]="name"
      [value]="value"
      [formControl]="control"
    />
  </fieldset>
  @if(control.invalid && control.touched) {
  <validation-error
    [errors]="control.errors"
    [zenClass]="zenClass"
    [customErrorMessages]="customErrorMessages"
    [color]="getErrorColor()"
  ></validation-error>
  }
</div>
